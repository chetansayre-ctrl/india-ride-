
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Ride</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 420px;
      margin: 25px auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #ccc;
    }
    h1 { color: #1455c0; text-align: center; }
    p { text-align: center; }
    label { display: block; margin-top: 14px; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      margin-top: 20px;
      background: #1455c0;
      color: white;
      border: none;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="container">
    <h1>India Ride 🚗</h1>
    <p>पूरे भारत में अपनी यात्रा की बुकिंग करें</p>

    <form id="rideForm">
      <label>आपका नाम</label>
      <input id="name" required maxlength="100"
        placeholder="अपना नाम लिखें">

      <label>कहाँ से जाना है?</label>
      <input id="pickup" required maxlength="150"
        placeholder="जैसे नागपुर">

      <label>कहाँ जाना है?</label>
      <input id="drop" required maxlength="150"
        placeholder="जैसे पुणे">

      <label>मोबाइल नंबर (वैकल्पिक)</label>
      <input id="phone" type="tel" maxlength="15"
        inputmode="tel" autocomplete="tel"
        placeholder="मोबाइल नंबर">

      <button id="submitButton" type="submit">
        बुकिंग भेजें
      </button>
    </form>

    <p id="message" aria-live="polite"></p>
  </div>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
      'https://paynpassvcvjvlytfuod.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_G77nTkUiKtmeZNJa8tNviQ_G8awJAp2';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('rideForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = 'बुकिंग भेजी जा रही है...';

      try {
        const booking = {
          customer_name: document.getElementById('name').value.trim(),
          pickup_location: document.getElementById('pickup').value.trim(),
          drop_location: document.getElementById('drop').value.trim(),
          customer_phone: document.getElementById('phone').value.trim() || null,
          status: 'pending'
        };

        const { error } = await supabase
          .from('ride_bookings')
          .insert(booking);

        if (error) throw error;

        message.textContent = 'बुकिंग सफलतापूर्वक भेजी गई!';
        form.reset();
      } catch (error) {
        const detail = error?.message || 'कृपया इंटरनेट और Supabase सेटिंग जाँचें।';
        message.textContent = 'बुकिंग नहीं हुई: ' + detail;
        console.error('India Ride booking error:', error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>

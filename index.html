
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Ride</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      margin: 30px auto;
    }
    h1 { color: #087443; }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #087443;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>India Ride 🚗</h1>
    <p>पूरे भारत में अपनी कार यात्रा खोजें</p>
    <input id="from" placeholder="कहाँ से जाना है?">
    <input id="to" placeholder="कहाँ जाना है?">
    <input id="date" type="date">
    <button onclick="searchRide()">राइड खोजें</button>
    <p id="result"></p>
  </div>
  <script>
    function searchRide() {
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      if (!from || !to) {
        document.getElementById('result').textContent =
          'कृपया शुरू और गंतव्य स्थान भरें।';
        return;
      }
      document.getElementById('result').textContent =
        from + ' से ' + to +
        ' तक की राइड के लिए अनुरोध तैयार है।';
    }
  </script>
</body>
</html>

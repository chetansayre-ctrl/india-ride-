
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Ride - कार बुकिंग</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      margin: 0;
      padding: 20px;
      color: #172554;
    }
    .card {
      max-width: 450px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { text-align: center; color: #14532d; }
    p { text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: 0;
      background: #15803d;
      color: white;
      font-weight: bold;
      margin-top: 22px;
    }
    #message { color: #166534; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🇮🇳 India Ride</h1>
    <p>पूरे भारत में अपनी कार यात्रा की बुकिंग शुरू करें</p>

    <form id="rideForm">
      <label for="name">आपका नाम</label>
      <input id="name" required placeholder="अपना नाम लिखें">

      <label for="pickup">कहाँ से जाना है?</label>
      <input id="pickup" required placeholder="जैसे नागपुर">

      <label for="drop">कहाँ जाना है?</label>
      <input id="drop" required placeholder="जैसे पुणे">

      <label for="phone">मोबाइल नंबर</label>
      <input id="phone" type="tel" placeholder="मोबाइल नंबर">

      <button type="submit">बुकिंग अनुरोध करें</button>
    </form>

    <p id="message"></p>
    <p>ड्राइवर अपना किराया बताएँगे।</p>
  </div>

  <script>
    document.getElementById("rideForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "आपका फॉर्म तैयार है। बुकिंग भेजने की सुविधा अगले चरण में जोड़ी जाएगी।";
    });
  </script>
</body>
</html>
